<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Неоновый Червяк 3D</title>
<style>
  :root{
    --bg:#050816;
    --panel:rgba(8,12,28,.72);
    --line:rgba(110,231,255,.35);
    --text:#f4fbff;
    --muted:#9fb7c5;
    --accent:#57f3ff;
    --danger:#ff4d7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);touch-action:none;overscroll-behavior:none
  }
  canvas{display:block;width:100vw;height:100vh}
  #hud{
    position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:10;display:flex;gap:10px;pointer-events:none
  }
  .hud-card{
    min-width:118px;padding:10px 14px;border-radius:15px;
    background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25);
    text-align:center
  }
  .label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .value{font-size:22px;font-weight:800;line-height:1.1;margin-top:2px}
  #hint{
    position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:9;padding:9px 13px;border-radius:12px;
    background:rgba(8,12,28,.56);border:1px solid rgba(255,255,255,.10);
    color:#cfe8f3;font-size:12px;pointer-events:none;white-space:nowrap
  }
  #gameOver{
    position:fixed;inset:0;z-index:30;display:none;place-items:center;
    background:rgba(2,4,12,.62);backdrop-filter:blur(8px)
  }
  #gameOver.show{display:grid}
  .panel{
    width:min(92vw,420px);padding:28px;border-radius:24px;text-align:center;
    background:rgba(8,12,28,.92);border:1px solid rgba(110,231,255,.32);
    box-shadow:0 24px 80px rgba(0,0,0,.55)
  }
  .panel h1{margin:0 0 8px;font-size:34px}
  .panel p{margin:6px 0;color:#b8d0dc}
  #restart{
    margin-top:18px;width:100%;height:52px;border:0;border-radius:15px;
    background:linear-gradient(135deg,#4be8ff,#7d7cff);color:#04111b;
    font-weight:900;font-size:16px;cursor:pointer
  }
  #restart:active{transform:scale(.98)}
  #mobile{
    position:fixed;inset:0;z-index:12;pointer-events:none;display:none
  }
  .touch-zone{
    position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:132px;height:132px;
    border-radius:50%;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.045);backdrop-filter:blur(8px);
    pointer-events:auto;touch-action:none
  }
  #steer{left:18px}
  #boost{right:18px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#ddfbff}
  #stick{
    position:absolute;width:54px;height:54px;border-radius:50%;left:39px;top:39px;
    background:rgba(87,243,255,.28);border:1px solid rgba(87,243,255,.6);
    box-shadow:0 0 24px rgba(87,243,255,.22)
  }
  @media (pointer:coarse){
    #mobile{display:block}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="hud">
  <div class="hud-card"><div class="label">Очки</div><div class="value" id="score">0</div></div>
  <div class="hud-card"><div class="label">Длина</div><div class="value" id="length">18</div></div>
</div>

<div id="hint">Мышь / A D / ← → — поворот · ЛКМ или Пробел — ускорение</div>

<div id="mobile">
  <div id="steer" class="touch-zone"><div id="stick"></div></div>
  <div id="boost" class="touch-zone">УСКОРЕНИЕ</div>
</div>

<div id="gameOver">
  <div class="panel">
    <h1>Игра окончена</h1>
    <p>Финальный счёт: <b id="finalScore">0</b></p>
    <p>Длина: <b id="finalLength">0</b></p>
    <button id="restart">Играть снова</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>
<script>
(() => {
  'use strict';

  const ARENA = 58;
  const HALF = ARENA / 2;
  const FOOD_COUNT = 42;
  const START_SEGMENTS = 18;
  const SEGMENT_SPACING = 0.92;
  const HISTORY_STEP = 0.18;
  const BASE_SPEED = 8.0;
  const BOOST_SPEED = 13.5;
  const TURN_SPEED = 2.45;
  const HEAD_Y = 0.72;

  let scene, camera, renderer, clock;
  let head, eyes = [], segments = [], foods = [], particles = [];
  let history = [];
  let heading = 0;
  let targetHeading = 0;
  let score = 0;
  let alive = true;
  let boosting = false;
  let keys = {};
  let pointerX = 0;
  let touchSteer = 0;
  let historyAccumulator = 0;

  const scoreEl = document.getElementById('score');
  const lengthEl = document.getElementById('length');
  const gameOverEl = document.getElementById('gameOver');
  const finalScoreEl = document.getElementById('finalScore');
  const finalLengthEl = document.getElementById('finalLength');
  const restartBtn = document.getElementById('restart');

  init();
  resetGame();
  animate();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040714);
    scene.fog = new THREE.FogExp2(0x050816, 0.018);

    camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 220);
    camera.position.set(0, 7, 10);

    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    clock = new THREE.Clock();

    const hemi = new THREE.HemisphereLight(0x8ddcff, 0x101020, 1.6);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 2.0);
    key.position.set(10, 18, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -40;
    key.shadow.camera.right = 40;
    key.shadow.camera.top = 40;
    key.shadow.camera.bottom = -40;
    scene.add(key);

    const cyan = new THREE.PointLight(0x30eaff, 45, 55, 2);
    cyan.position.set(-18, 12, -14);
    scene.add(cyan);

    const violet = new THREE.PointLight(0x8b5cff, 36, 50, 2);
    violet.position.set(16, 8, 16);
    scene.add(violet);

    buildArena();
    bindInput();

    addEventListener('resize', onResize, { passive: true });
  }

  function buildArena() {
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(ARENA, ARENA),
      new THREE.MeshStandardMaterial({
        color: 0x070b18,
        roughness: 0.78,
        metalness: 0.22
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(ARENA, 29, 0x2de7ff, 0x173352);
    grid.position.y = 0.012;
    grid.material.transparent = true;
    grid.material.opacity = 0.35;
    scene.add(grid);

    const railMat = new THREE.MeshStandardMaterial({
      color: 0x1eeaff,
      emissive: 0x0aa6d6,
      emissiveIntensity: 2.2,
      metalness: 0.4,
      roughness: 0.2
    });

    const railGeoH = new THREE.BoxGeometry(ARENA + 1, 0.45, 0.45);
    const railGeoV = new THREE.BoxGeometry(0.45, 0.45, ARENA + 1);

    [
      [railGeoH, 0, 0.25, -HALF],
      [railGeoH, 0, 0.25,  HALF],
      [railGeoV, -HALF, 0.25, 0],
      [railGeoV,  HALF, 0.25, 0]
    ].forEach(([g,x,y,z]) => {
      const m = new THREE.Mesh(g, railMat);
      m.position.set(x,y,z);
      scene.add(m);
    });
  }

  function createWorm() {
    const headMat = new THREE.MeshStandardMaterial({
      color: 0x74f5ff,
      emissive: 0x116d7d,
      emissiveIntensity: 1.0,
      roughness: 0.36,
      metalness: 0.08
    });

    head = new THREE.Mesh(new THREE.SphereGeometry(0.72, 28, 20), headMat);
    head.scale.set(1.08, 0.9, 1.18);
    head.position.set(0, HEAD_Y, 0);
    head.castShadow = true;
    scene.add(head);

    const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
    const pupilMat = new THREE.MeshStandardMaterial({ color: 0x071018, roughness: 0.2 });

    [-0.28, 0.28].forEach(x => {
      const e = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), eyeWhite);
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.082, 14, 10), pupilMat);
      e.position.set(x, 0.16, 0.59);
      p.position.set(0, 0, 0.15);
      e.add(p);
      head.add(e);
      eyes.push(e);
    });

    for (let i = 0; i < START_SEGMENTS; i++) addSegment();
  }

  function addSegment() {
    const i = segments.length;
    const hue = (0.51 + (i % 12) * 0.007) % 1;
    const color = new THREE.Color().setHSL(hue, 0.78, 0.58);
    const mat = new THREE.MeshStandardMaterial({
      color,
      emissive: color.clone().multiplyScalar(0.22),
      emissiveIntensity: 0.9,
      roughness: 0.42,
      metalness: 0.05
    });
    const seg = new THREE.Mesh(new THREE.SphereGeometry(0.59, 22, 16), mat);
    seg.scale.set(1.0, 0.85, 1.12);
    seg.castShadow = true;
    seg.receiveShadow = true;
    scene.add(seg);
    segments.push(seg);
  }

  function clearWorm() {
    if (head) {
      scene.remove(head);
      head.geometry.dispose();
      head.material.dispose();
      head = null;
    }
    segments.forEach(s => {
      scene.remove(s);
      s.geometry.dispose();
      s.material.dispose();
    });
    segments = [];
    eyes = [];
  }

  function spawnFood(existing) {
    let food = existing;
    if (!food) {
      const color = new THREE.Color().setHSL(Math.random(), 0.95, 0.64);
      const mat = new THREE.MeshStandardMaterial({
        color,
        emissive: color,
        emissiveIntensity: 2.6,
        roughness: 0.18,
        metalness: 0.05
      });
      food = new THREE.Mesh(new THREE.SphereGeometry(0.34, 18, 14), mat);
      scene.add(food);
      foods.push(food);
    }

    let x, z, tries = 0;
    do {
      x = THREE.MathUtils.randFloat(-HALF + 2.2, HALF - 2.2);
      z = THREE.MathUtils.randFloat(-HALF + 2.2, HALF - 2.2);
      tries++;
    } while (Math.hypot(x - head.position.x, z - head.position.z) < 5 && tries < 20);

    food.position.set(x, 0.44, z);
    food.userData.phase = Math.random() * Math.PI * 2;
  }

  function clearFood() {
    foods.forEach(f => {
      scene.remove(f);
      f.geometry.dispose();
      f.material.dispose();
    });
    foods = [];
  }

  function burst(position, color) {
    for (let i = 0; i < 14; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 1
      });
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), mat);
      p.position.copy(position);
      p.userData.vel = new THREE.Vector3(
        THREE.MathUtils.randFloatSpread(4.5),
        THREE.MathUtils.randFloat(1.6, 4.5),
        THREE.MathUtils.randFloatSpread(4.5)
      );
      p.userData.life = 0.55 + Math.random() * 0.35;
      scene.add(p);
      particles.push(p);
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.userData.life -= dt;
      p.userData.vel.y -= 7 * dt;
      p.position.addScaledVector(p.userData.vel, dt);
      p.material.opacity = Math.max(0, p.userData.life * 1.7);
      const s = Math.max(0.05, p.userData.life * 1.5);
      p.scale.setScalar(s);
      if (p.userData.life <= 0) {
        scene.remove(p);
        p.geometry.dispose();
        p.material.dispose();
        particles.splice(i, 1);
      }
    }
  }

  function resetGame() {
    clearWorm();
    clearFood();

    particles.forEach(p => {
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
    });
    particles = [];

    createWorm();

    heading = 0;
    targetHeading = 0;
    score = 0;
    alive = true;
    boosting = false;
    historyAccumulator = 0;
    history = [];

    for (let i = 0; i < 1600; i++) {
      history.push(new THREE.Vector3(0, HEAD_Y, -i * HISTORY_STEP));
    }

    for (let i = 0; i < FOOD_COUNT; i++) spawnFood();

    scoreEl.textContent = '0';
    lengthEl.textContent = String(segments.length);
    gameOverEl.classList.remove('show');

    camera.position.set(0, 6.5, -9.5);
    camera.lookAt(head.position);
  }

  function bindInput() {
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        boosting = true;
        e.preventDefault();
      }
    });

    addEventListener('keyup', e => {
      keys[e.code] = false;
      if (e.code === 'Space') boosting = false;
    });

    addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse') {
        pointerX = (e.clientX / innerWidth) * 2 - 1;
      }
    }, { passive: true });

    renderer.domElement.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button === 0) boosting = true;
    });

    addEventListener('pointerup', e => {
      if (e.pointerType === 'mouse') boosting = false;
    });

    const steer = document.getElementById('steer');
    const stick = document.getElementById('stick');
    const boost = document.getElementById('boost');

    let steerPointer = null;

    function updateStick(e) {
      const r = steer.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      let dx = e.clientX - cx;
      let dy = e.clientY - cy;
      const max = 38;
      const len = Math.hypot(dx, dy) || 1;
      if (len > max) {
        dx = dx / len * max;
        dy = dy / len * max;
      }
      stick.style.transform = `translate(${dx}px,${dy}px)`;
      touchSteer = THREE.MathUtils.clamp(dx / max, -1, 1);
    }

    steer.addEventListener('pointerdown', e => {
      steerPointer = e.pointerId;
      steer.setPointerCapture(e.pointerId);
      updateStick(e);
    });
    steer.addEventListener('pointermove', e => {
      if (e.pointerId === steerPointer) updateStick(e);
    });
    function releaseSteer(e) {
      if (e.pointerId !== steerPointer) return;
      steerPointer = null;
      touchSteer = 0;
      stick.style.transform = 'translate(0,0)';
    }
    steer.addEventListener('pointerup', releaseSteer);
    steer.addEventListener('pointercancel', releaseSteer);

    boost.addEventListener('pointerdown', e => {
      boosting = true;
      boost.setPointerCapture(e.pointerId);
    });
    boost.addEventListener('pointerup', () => boosting = false);
    boost.addEventListener('pointercancel', () => boosting = false);

    restartBtn.addEventListener('click', resetGame);
  }

  function shortestAngle(a, b) {
    return Math.atan2(Math.sin(b - a), Math.cos(b - a));
  }

  function updateMovement(dt, t) {
    if (!alive) return;

    let steer = 0;

    if (keys['KeyA'] || keys['ArrowLeft']) steer -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) steer += 1;

    if (Math.abs(touchSteer) > 0.04) {
      steer = touchSteer;
    } else if (steer === 0) {
      steer = pointerX * 0.78;
    }

    targetHeading += steer * TURN_SPEED * dt;
    heading += shortestAngle(heading, targetHeading) * Math.min(1, dt * 7.5);

    const speed = boosting ? BOOST_SPEED : BASE_SPEED;
    head.position.x += Math.sin(heading) * speed * dt;
    head.position.z += Math.cos(heading) * speed * dt;
    head.position.y = HEAD_Y + Math.sin(t * 8) * 0.035;
    head.rotation.y = heading;

    historyAccumulator += speed * dt;
    while (historyAccumulator >= HISTORY_STEP) {
      history.unshift(head.position.clone());
      historyAccumulator -= HISTORY_STEP;
    }

    const needed = Math.ceil((segments.length + 8) * SEGMENT_SPACING / HISTORY_STEP) + 100;
    if (history.length > needed) history.length = needed;

    for (let i = 0; i < segments.length; i++) {
      const distance = (i + 1) * SEGMENT_SPACING;
      const idx = Math.min(history.length - 1, Math.floor(distance / HISTORY_STEP));
      const next = Math.min(history.length - 1, idx + 1);
      const frac = (distance / HISTORY_STEP) - idx;

      const p = history[idx].clone().lerp(history[next], frac);
      const side = Math.sin(t * 7 - i * 0.58) * 0.105 * Math.min(1, i / 4);
      const tangentA = history[Math.max(0, idx - 2)];
      const tangentB = history[Math.min(history.length - 1, idx + 2)];
      const tangent = new THREE.Vector3().subVectors(tangentA, tangentB).setY(0).normalize();
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);

      p.addScaledVector(normal, side);
      p.y = HEAD_Y * 0.82 + Math.sin(t * 7.5 - i * 0.55) * 0.055;

      const seg = segments[i];
      seg.position.lerp(p, Math.min(1, dt * 18));

      if (tangent.lengthSq() > 0.001) {
        seg.rotation.y = Math.atan2(tangent.x, tangent.z);
      }

      const taper = THREE.MathUtils.lerp(1, 0.62, i / Math.max(1, segments.length - 1));
      seg.scale.set(taper, taper * 0.86, taper * 1.12);
    }

    checkFood(t);
    checkDeath();
  }

  function checkFood(t) {
    for (const f of foods) {
      f.rotation.y += 0.02;
      f.position.y = 0.44 + Math.sin(t * 3.3 + f.userData.phase) * 0.08;

      const dx = head.position.x - f.position.x;
      const dz = head.position.z - f.position.z;
      if (dx * dx + dz * dz < 1.05 * 1.05) {
        burst(f.position, f.material.color);
        score += 10;
        addSegment();
        if (score % 30 === 0) addSegment();
        scoreEl.textContent = String(score);
        lengthEl.textContent = String(segments.length);
        spawnFood(f);
      }
    }
  }

  function checkDeath() {
    if (Math.abs(head.position.x) > HALF - 0.8 || Math.abs(head.position.z) > HALF - 0.8) {
      endGame();
      return;
    }

    const skip = 11;
    for (let i = skip; i < segments.length; i++) {
      const s = segments[i];
      const dx = head.position.x - s.position.x;
      const dz = head.position.z - s.position.z;
      if (dx * dx + dz * dz < 0.72 * 0.72) {
        endGame();
        return;
      }
    }
  }

  function endGame() {
    if (!alive) return;
    alive = false;
    boosting = false;
    finalScoreEl.textContent = String(score);
    finalLengthEl.textContent = String(segments.length);
    gameOverEl.classList.add('show');
  }

  function updateCamera(dt) {
    if (!head) return;

    const forward = new THREE.Vector3(Math.sin(heading), 0, Math.cos(heading));
    const desired = head.position.clone()
      .addScaledVector(forward, -7.9)
      .add(new THREE.Vector3(0, 5.6, 0));

    camera.position.lerp(desired, 1 - Math.pow(0.001, dt));
    const look = head.position.clone().addScaledVector(forward, 3.4);
    look.y = 0.8;
    camera.lookAt(look);
  }

  function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.033);
    const t = clock.elapsedTime;

    updateMovement(dt, t);
    updateParticles(dt);
    updateCamera(dt);

    renderer.render(scene, camera);
  }

  function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  }
})();
</script>
</body>
</html>
